name: omc_mgmt_tool_dev

services:
  redis:
    build:
      context: ..
      dockerfile: docker/redis.Dockerfile
    image: omc_mgmt_tool-redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omc_network

  backend:
    build:
      context: ..
      dockerfile: docker/backend.dev.Dockerfile
    image: omc_mgmt_tool-backend:dev
    container_name: backend
    restart: always
    command: sh -c "alembic upgrade head && python -c 'import asyncio; from app.core.seed import seed_default_admin; asyncio.run(seed_default_admin())' && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omc_mgmt}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_URL=redis://redis:6379/0
    volumes:
      # Live development: mount local backend source files into container
      - ../backend:/app
      - backend_data:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - omc_network

  celery_worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    image: omc_mgmt_tool-celery_worker:dev
    container_name: celery_worker
    restart: always
    command: celery -A app.workers.celery_app.celery worker --loglevel=info --pool=threads --concurrency=4
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omc_mgmt}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../backend:/app
      - backend_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - omc_network

  celery_beat:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    image: omc_mgmt_tool-celery_beat:dev
    container_name: celery_beat
    restart: always
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omc_mgmt}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../backend:/app
      - backend_data:/app/storage
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - omc_network

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.dev.Dockerfile
    image: omc_mgmt_tool-frontend:dev
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Live development: mount frontend source code into container
      - ../frontend:/app
      - frontend_data:/app/node_modules
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_WS_BASE_URL=wss://localhost/api/v1/ws
    depends_on:
      - backend
    networks:
      - omc_network

  nginx:
    build:
      context: ..
      dockerfile: docker/nginx.Dockerfile
    image: omc_mgmt_tool-nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ../storage/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - omc_network

volumes:
  redis_data:
  backend_data:
  frontend_data:

networks:
  omc_network:
    name: omc_network
    external: true
