name: omc_postgres

services:
  postgres:
    build:
      context: ..
      dockerfile: docker/postgres.Dockerfile
    image: omc-postgres:latest
    container_name: postgres
    restart: always
    env_file:
      - ../.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-omc_reports}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-omc_reports}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - omc_network

# Đặt tên omc_postgres_data VÀ trỏ trực tiếp vào thư mục máy thật
volumes:
  postgres_data:
    name: omc_postgres_data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/storage/postgres_data

networks:
  omc_network:
    name: omc_network
    external: true
